name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Everything runs in your browser, so browser and OS details help a lot.
        Please don't paste share links or exports that contain private architecture details.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project from the Microservices template
        2. Drag a Cache onto the canvas
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 142 on macOS 26
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Live demo (workers.dev)
        - Self-hosted / local build
        - Other
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, console errors or a minimal project JSON
      description: Optional. Drag files here.
